<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>15-Min Daily Calisthenics</title>
<style>
:root {
  --bg: #08131E;
  --surface: #0D1C2B;
  --card: #112236;
  --border: #1C3348;
  --text: #D8EAF6;
  --muted: #4A6A88;
  --dim: #2A4560;
  --warmup: #5BA3D9;
  --work: #5BC874;
  --rest: #E8834A;
  --cooldown: #9B6FE8;
  --r: 14px;
  --r-sm: 9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative}
button{cursor:pointer;font-family:inherit}

/* ── HOME ───────────────────────────────────── */
#home{display:flex;flex-direction:column;min-height:100vh;padding-bottom:28px}
.h-header{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 16px}
.h-logo{font-size:.95rem;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.h-logo em{color:var(--work);font-style:normal}
.h-meta{font-size:.72rem;color:var(--muted);margin-top:2px;font-weight:500}
.vol-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1rem;transition:.15s}
.vol-btn:hover{color:var(--text);border-color:var(--dim)}

.week-strip{display:flex;gap:7px;padding:0 20px 20px;justify-content:space-between}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.wd-lbl{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.wd-btn{width:100%;aspect-ratio:1;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:.18s;position:relative}
.wd.selected .wd-btn{border-color:var(--accent,var(--warmup));background:rgba(91,163,217,.1);box-shadow:0 0 0 2px rgba(91,163,217,.2)}
.wd.rest-day .wd-btn{opacity:.35;cursor:not-allowed}
.wd.done .wd-btn::after{content:'✓';position:absolute;top:-5px;right:-5px;background:var(--work);color:#052e16;border-radius:50%;width:15px;height:15px;font-size:.5rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.wd.today .wd-lbl{color:var(--accent,var(--warmup))}

.day-card{margin:0 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.dc-head{padding:18px 20px 15px;display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--border)}
.dc-icon{font-size:2.2rem;line-height:1}
.dc-info{flex:1}
.dc-name{font-size:1.25rem;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.dc-sub{font-size:.75rem;color:var(--muted);margin-top:4px;font-weight:500}
.dc-badge{padding:3px 10px;border-radius:20px;font-size:.62rem;font-weight:700;letter-spacing:.5px;margin-top:8px;display:inline-block}
.dc-phases{display:flex;padding:14px 20px;gap:0;border-bottom:1px solid var(--border)}
.dc-phase{flex:1;text-align:center;padding:8px 4px;border-radius:var(--r-sm)}
.dc-phase-lbl{font-size:.58rem;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.dc-phase-val{font-size:.88rem;font-weight:700}
.dc-phase-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dc-exercises{padding:14px 20px}
.dc-ex-title{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.dc-ex-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.85rem;border-bottom:1px solid rgba(28,51,72,.6)}
.dc-ex-item:last-child{border-bottom:none}
.dc-ex-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dc-ex-name{flex:1;font-weight:500}
.dc-ex-time{color:var(--muted);font-size:.75rem}

.streak-bar{display:flex;align-items:center;gap:12px;margin:16px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 16px}
.streak-icon{font-size:1.4rem}
.streak-text{font-size:.82rem;color:var(--muted)}
.streak-text strong{color:var(--text);font-weight:700}

.start-wrap{padding:16px 20px 0}
.start-btn{width:100%;padding:17px;border-radius:var(--r);border:none;font-size:1.05rem;font-weight:800;letter-spacing:.3px;transition:.15s;background:var(--work);color:#052e16}
.start-btn:hover{filter:brightness(1.08)}
.start-btn:active{transform:scale(.98)}
.start-btn.rest-mode{background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:not-allowed}

/* ── WORKOUT ────────────────────────────────── */
#workout{display:none;flex-direction:column;min-height:100vh}
.w-topbar{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.w-back{background:none;border:none;color:var(--muted);font-size:1.1rem;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.w-phase-lbl{flex:1;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.w-round{font-size:.72rem;color:var(--muted);font-weight:600}

.prog-track{height:3px;background:var(--border);margin:0 18px 14px;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .8s linear}

.phase-pill{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px 14px;padding:8px 16px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border:1.5px solid}

.ex-name{font-size:1.5rem;font-weight:800;text-align:center;letter-spacing:-.4px;padding:0 18px;line-height:1.2;margin-bottom:3px}
.ex-focus{font-size:.75rem;color:var(--muted);text-align:center;font-weight:500;margin-bottom:14px;padding:0 18px}

.anim-box{width:186px;height:186px;margin:0 auto 14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0}
#anim-svg{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#anim-svg svg{width:78%;height:78%}
#anim-svg img,#anim-svg video{width:100%;height:100%;object-fit:contain}
#anim-svg .visual-message{padding:16px;text-align:center;font-size:.8rem;line-height:1.5}
#anim-svg.visual-paused *{animation-play-state:paused!important}
#anim-svg.visual-static *{animation:none!important}
#anim-svg.visual-static .bd-fb,#anim-svg.visual-static .db-fb,#anim-svg.visual-static .sl-fb{display:none}
@media(prefers-reduced-motion:reduce){.comp-ring{animation:none}}
.mode-chip{position:absolute;top:9px;right:9px;padding:3px 9px;border-radius:20px;font-size:.58rem;font-weight:800;letter-spacing:1.5px}

.timer-wrap{text-align:center;margin-bottom:8px;position:relative}
.timer-num{font-size:5.5rem;font-weight:900;letter-spacing:-4px;line-height:1;font-variant-numeric:tabular-nums;transition:color .4s}
.timer-sub{font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

.timer-bar{height:5px;background:var(--border);margin:10px 18px 12px;border-radius:3px;overflow:hidden}
.timer-bar-fill{height:100%;border-radius:3px;transition:width 1s linear}

.cue-box{margin:0 18px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px}
.cue-lbl{font-size:.58rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.cue-txt{font-size:.82rem;line-height:1.45;color:var(--text)}

.next-hint{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:14px;padding:0 18px}
.next-hint strong{color:var(--text)}

.w-controls{display:flex;gap:10px;padding:0 18px 24px;margin-top:auto}
.w-play{flex:1;padding:15px;border-radius:var(--r);border:none;font-size:1rem;font-weight:800;letter-spacing:.2px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.w-play:active{transform:scale(.97)}
.w-skip{padding:15px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:700;transition:.15s;display:flex;align-items:center;gap:6px}
.w-skip:hover{color:var(--text);border-color:var(--dim)}

/* REST SCREEN */
.rest-screen{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;flex:1}
.rest-screen.active{display:flex}
.rest-label{font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--rest);margin-bottom:6px}
.rest-timer{font-size:7rem;font-weight:900;letter-spacing:-5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);margin-bottom:18px}
.rest-up-lbl{font-size:.72rem;color:var(--muted);margin-bottom:5px;font-weight:600}
.rest-up-name{font-size:1.4rem;font-weight:800;letter-spacing:-.3px}
.rest-bar{height:6px;width:200px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:20px}
.rest-bar-fill{height:100%;background:var(--rest);border-radius:3px;transition:width 1s linear}

/* TRANSITION */
#transition{position:fixed;inset:0;background:#08131E;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:200;padding:30px}
#transition.on{display:flex}
.tr-phase{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.tr-title{font-size:2.2rem;font-weight:900;letter-spacing:-.8px;margin-bottom:6px}
.tr-sub{font-size:.9rem;color:var(--muted);margin-bottom:24px}
.tr-count{font-size:4rem;font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums}

/* COMPLETE */
#complete{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 20px;text-align:center}
.comp-ring{width:90px;height:90px;background:rgba(91,200,116,.12);border:2px solid var(--work);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:20px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.comp-title{font-size:1.9rem;font-weight:900;letter-spacing:-.6px;margin-bottom:6px}
.comp-sub{color:var(--muted);font-size:.88rem;margin-bottom:24px}
.comp-stats{display:flex;gap:12px;margin-bottom:24px;width:100%}
.comp-stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 10px;text-align:center}
.comp-stat-val{font-size:1.7rem;font-weight:900;letter-spacing:-.8px}
.comp-stat-lbl{font-size:.62rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.rule2{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:22px;width:100%;text-align:left}
.rule2-title{font-size:.6rem;font-weight:700;color:var(--warmup);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.rule2-txt{font-size:.8rem;color:var(--muted);line-height:1.55}
.rule2-txt strong{color:var(--text)}
.comp-done{width:100%;padding:16px;border-radius:var(--r);border:none;font-size:1rem;font-weight:800;background:var(--work);color:#052e16;margin-bottom:10px;transition:.15s}
.comp-done:active{transform:scale(.98)}
.comp-home{background:none;border:none;color:var(--muted);font-size:.88rem;padding:8px}

/* ── SVG ANIMATION KEYFRAMES ────────────────── */
/* arm circles */
@keyframes sp-l{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes sp-r{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
.ac-al{animation:sp-l 1.1s linear infinite;transform-origin:68px 62px}
.ac-ar{animation:sp-r 1.1s linear infinite;transform-origin:132px 62px}

/* cross-chest arms */
@keyframes cx-l{0%,100%{transform:rotate(-65deg)}50%{transform:rotate(15deg)}}
@keyframes cx-r{0%,100%{transform:rotate(65deg)}50%{transform:rotate(-15deg)}}
.cx-l{animation:cx-l 1.3s ease-in-out infinite;transform-origin:68px 62px}
.cx-r{animation:cx-r 1.3s ease-in-out infinite;transform-origin:132px 62px}

/* cat-cow back */
@keyframes cat-a{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
.cat-back{animation:cat-a 2s ease-in-out infinite;transform-origin:center 85px}

/* leg swing */
@keyframes lsw{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(40deg)}}
.lsw{animation:lsw 1.4s ease-in-out infinite;transform-origin:100px 110px}

/* hip hinge */
@keyframes hh{0%,100%{transform:rotate(0deg)}50%{transform:rotate(50deg)}}
.hh-up{animation:hh 2s ease-in-out infinite;transform-origin:100px 110px}

/* ankle roll */
@keyframes ank{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ank-l{animation:ank 1s linear infinite;transform-origin:74px 178px}
.ank-r{animation:ank 1s linear infinite reverse;transform-origin:126px 178px}

/* scap squeeze */
@keyframes scl{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
@keyframes scr{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.sc-l{animation:scl 1.4s ease-in-out infinite}
.sc-r{animation:scr 1.4s ease-in-out infinite}

/* reach up */
@keyframes ru{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.ru-arms{animation:ru 2s ease-in-out infinite}

/* jumping jacks arms/legs */
@keyframes jj-al{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-68deg)}}
@keyframes jj-ar{0%,100%{transform:rotate(0deg)}50%{transform:rotate(68deg)}}
@keyframes jj-ll{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-18deg)}}
@keyframes jj-lr{0%,100%{transform:rotate(0deg)}50%{transform:rotate(18deg)}}
.jj-al{animation:jj-al 1s ease-in-out infinite;transform-origin:68px 62px}
.jj-ar{animation:jj-ar 1s ease-in-out infinite;transform-origin:132px 62px}
.jj-ll{animation:jj-ll 1s ease-in-out infinite;transform-origin:85px 108px}
.jj-lr{animation:jj-lr 1s ease-in-out infinite;transform-origin:115px 108px}

/* torso rotate */
@keyframes tr{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.tr-up{animation:tr 2s ease-in-out infinite;transform-origin:100px 78px}

/* squat body down */
@keyframes sq-d{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
.sq-body{animation:sq-d 2.2s ease-in-out infinite}

/* glute bridge hips */
@keyframes gb{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.gb-hip{animation:gb 2.2s ease-in-out infinite;transform-origin:120px 105px}

/* plank breathe */
@keyframes pb{0%,100%{opacity:.85}50%{opacity:1}}
.pk-body{animation:pb 3s ease-in-out infinite}

/* push-up motion */
@keyframes pu{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(10deg)}}
.pu-up{animation:pu 2s ease-in-out infinite;transform-origin:42px 122px}

/* side-tap arm */
@keyframes st{0%,100%{transform:translateX(0) translateY(0)}30%{transform:translateX(-22px) translateY(6px)}70%{transform:translateX(22px) translateY(6px)}}
.st-arm{animation:st 2.2s ease-in-out infinite}

/* row pull */
@keyframes rw{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
.rw-arms{animation:rw 2s ease-in-out infinite;transform-origin:46px 100px}

/* bird dog - two frame */
@keyframes bd-a{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes bd-b{0%,45%{opacity:0}55%,100%{opacity:1}}
.bd-fa{animation:bd-a 3s ease-in-out infinite}
.bd-fb{animation:bd-b 3s ease-in-out infinite}

/* dead bug alternating */
@keyframes db-a{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes db-b{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.db-fa{animation:db-a 3s ease-in-out infinite}
.db-fb{animation:db-b 3s ease-in-out infinite}

/* step lunge two-frame */
@keyframes sl-a{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes sl-b{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.sl-fa{animation:sl-a 2.5s ease-in-out infinite}
.sl-fb{animation:sl-b 2.5s ease-in-out infinite}

/* breathing chest */
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
.br-chest{animation:br 4s ease-in-out infinite;transform-origin:120px 90px}

/* windmill arm sweep */
@keyframes wm{0%,100%{transform:rotate(0deg)}50%{transform:rotate(155deg)}}
.wm-arm{animation:wm 2.5s ease-in-out infinite;transform-origin:90px 85px}

/* reach/overhead */
@keyframes oh{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.oh-l{animation:oh 2s ease-in-out infinite;transform-origin:68px 62px}
@keyframes oh2{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-10deg)}}
.oh-r{animation:oh2 2s ease-in-out infinite;transform-origin:132px 62px}

/* cobra lift */
@keyframes co{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-20deg)}}
.co-up{animation:co 3s ease-in-out infinite;transform-origin:120px 118px}

/* calf stretch lean */
@keyframes cf{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
.cf-body{animation:cf 3s ease-in-out infinite;transform-origin:80px 182px}

/* thread needle arm */
@keyframes tn{0%,100%{transform:rotate(0deg)}50%{transform:rotate(55deg)}}
.tn-arm{animation:tn 2.5s ease-in-out infinite;transform-origin:72px 80px}

/* lat stretch lean */
@keyframes ls{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-12deg)}}
.ls-body{animation:ls 3s ease-in-out infinite;transform-origin:100px 110px}

/* neck tilt */
@keyframes nt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-18deg)}}
.nt-head{animation:nt 2.5s ease-in-out infinite;transform-origin:100px 36px}

/* figure 4 leg cross */
@keyframes f4{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg)}}
.f4-leg{animation:f4 3s ease-in-out infinite;transform-origin:110px 140px}

/* hip flexor tilt */
@keyframes hf{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg)}}
.hf-body{animation:hf 3s ease-in-out infinite;transform-origin:90px 80px}

/* walking step */
@keyframes wk-l{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes wk-r{0%,100%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}}
.wk-ll{animation:wk-l 0.9s ease-in-out infinite;transform-origin:85px 108px}
.wk-lr{animation:wk-r 0.9s ease-in-out infinite;transform-origin:115px 108px}
@keyframes wk-al{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes wk-ar{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.wk-al{animation:wk-al 0.9s ease-in-out infinite;transform-origin:68px 62px}
.wk-ar{animation:wk-ar 0.9s ease-in-out infinite;transform-origin:132px 62px}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home">
  <div class="h-header">
    <div>
      <div class="h-logo"><em>▶</em> 15-Min Calisthenics</div>
      <div class="h-meta" id="h-date-str"></div>
    </div>
    <button class="vol-btn" onclick="toggleVol()" id="vol-btn" title="Toggle sound">🔊</button>
  </div>

  <div class="week-strip" id="week-strip"></div>
  <div class="day-card" id="day-card"></div>

  <div class="streak-bar" id="streak-bar">
    <div class="streak-icon">🔥</div>
    <div class="streak-text" id="streak-text">Start your first workout today!</div>
  </div>

  <div class="start-wrap">
    <button class="start-btn" id="start-btn" onclick="startWorkout()">Start Workout</button>
  </div>
</div>

<!-- WORKOUT -->
<div id="workout">
  <div class="w-topbar">
    <button class="w-back" onclick="confirmBack()">&#8592;</button>
    <div class="w-phase-lbl" id="w-phase-lbl" style="color:var(--warmup)">Warm-Up</div>
    <div class="w-round" id="w-round"></div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="background:var(--warmup);width:0%"></div></div>
  <div class="phase-pill" id="phase-pill"></div>

  <!-- Exercise area (shown during work/warmup/cooldown) -->
  <div id="ex-area">
    <div class="ex-name" id="ex-name"></div>
    <div class="ex-focus" id="ex-focus"></div>
    <div class="anim-box" id="anim-box">
      <div id="anim-svg"></div>
      <div class="mode-chip" id="mode-chip"></div>
    </div>
    <div class="timer-wrap">
      <div class="timer-num" id="timer-num">00</div>
      <div class="timer-sub" id="timer-sub">seconds</div>
    </div>
    <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar-fill" style="width:100%"></div></div>
    <div class="cue-box">
      <div class="cue-lbl">Technique Cue</div>
      <div class="cue-txt" id="cue-txt"></div>
    </div>

const DAY_KEYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

let S = {
  selectedDay: null,
  screen: 'home',
  phase: 'warmup',
  phaseExIdx: 0,
  circuitRound: 1,
  mode: 'work',
  timeLeft: 0,
  totalTime: 0,

  workoutDayKey: null,
  midpointAlerted: false

let ticker = null;
let audioCtx = null;

/* =============================================
   STORAGE
   ============================================= */
function getCompleted(){try{return JSON.parse(localStorage.getItem('cal_done')||'{}');}catch{return {};}}
function markDone(dayKey){const d=getCompleted();const today=dateKey();if(!d[today])d[today]=[];if(!d[today].includes(dayKey))d[today].push(dayKey);localStorage.setItem('cal_done',JSON.stringify(d));}
function isDone(dayKey){const d=getCompleted();return Object.values(d).some(arr=>arr.includes?.(dayKey+'_done')||false)||Object.entries(d).some(([k,v])=>v&&v.includes&&v.includes(dayKey));}
function recordComplete(dayKey){const d=getCompleted();const today=dateKey();d[today+'_'+dayKey]=true;localStorage.setItem('cal_done',JSON.stringify(d));}
function wasDoneToday(dayKey){const d=getCompleted();const today=dateKey();return !!d[today+'_'+dayKey];}
function dateKey(){return new Date().toISOString().slice(0,10);}
function getStreak(){
  const d=getCompleted();let streak=0;let date=new Date();
  for(let i=0;i<30;i++){
    const k=date.toISOString().slice(0,10);
    const hasWorkout=Object.keys(d).some(key=>key.startsWith(k+'_'));
    if(hasWorkout)streak++;else if(i>0)break;
    date.setDate(date.getDate()-1);
  }
  return streak;
}

/* =============================================
   AUDIO
   ============================================= */
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq=880,dur=0.1,vol=0.3,type='sine'){
  if(S.muted)return;
  try{
    const ctx=getAudio();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=freq;osc.type=type;
    gain.gain.setValueAtTime(vol,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function countdownBeep(){beep(660,0.08,0.25);}
function workBeep(){beep(1047,0.12,0.4);setTimeout(()=>beep(1319,0.2,0.4),130);}
function restBeep(){beep(523,0.18,0.35);setTimeout(()=>beep(440,0.22,0.3),200);}
function phaseBeep(){beep(880,0.1,0.4);setTimeout(()=>beep(1047,0.1,0.4),120);setTimeout(()=>beep(1319,0.25,0.4),240);}
function midBeep(){beep(660,0.1,0.3);setTimeout(()=>beep(660,0.1,0.3),150);}

   HOME SCREEN

function renderHome(){
  const today=new Date().getDay();
  if(S.selectedDay===null)S.selectedDay=today;

  document.getElementById('h-date-str').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  renderWeekStrip(today);
  renderDayCard(S.selectedDay);
  renderStreak();
  const dayKey=DAY_KEYS[S.selectedDay];
  const w=WORKOUTS[dayKey];
  const startBtn=document.getElementById('start-btn');
  if(w.rest){startBtn.textContent='Rest Day 🧘';startBtn.className='start-btn rest-mode';}
  else{startBtn.textContent='Start Workout';startBtn.className='start-btn';startBtn.style.background=w.color;}
}

function renderWeekStrip(today){
  const strip=document.getElementById('week-strip');
  strip.innerHTML='';
  const completed=getCompleted();
  const todayKey=dateKey();
  [1,2,3,4,5,6,0].forEach(di=>{
    const key=DAY_KEYS[di];
    const w=WORKOUTS[key];
    const done=!!completed[todayKey+'_'+key]||Object.keys(completed).some(k=>k.startsWith(todayKey+'_'+key));
    const selected=S.selectedDay===di;
    const rest=w.rest;
    const isToday=di===today;
    const div=document.createElement('div');
    div.className='wd'+(selected?' selected':'')+(rest?' rest-day':'')+(done?' done':'')+(isToday?' today':'');
    div.style.setProperty('--accent',w.color);
    div.innerHTML=`<div class="wd-lbl">${DAY_SHORT[di]}</div><div class="wd-btn">${w.icon}</div>`;
    if(!rest)div.onclick=()=>{S.selectedDay=di;renderHome();};
    strip.appendChild(div);
  });
}

function renderStreak(){

/* =============================================
   WORKOUT START
   ============================================= */
function startWorkout(){
  const key=DAY_KEYS[S.selectedDay];
  const w=WORKOUTS[key];
  if(w.rest)return;
  S.workoutDayKey=key;
  S.phase=w.warmup.length?'warmup':'circuit';
  S.phaseExIdx=0;S.circuitRound=1;S.paused=false;S.midpointAlerted=false;
  setupCurrentStep();
  showScreen('workout');
  renderWorkoutUI();
  startTicker();
}

function setupCurrentStep(){
  const w=WORKOUTS[S.workoutDayKey];
  if(S.phase==='warmup'){
    const ex=w.warmup[S.phaseExIdx];
    S.mode='work';S.timeLeft=ex.dur;S.totalTime=ex.dur;
  } else if(S.phase==='circuit'){
    const ex=w.circuit[S.phaseExIdx];
    if(S.mode==='work'){S.timeLeft=ex.work;S.totalTime=ex.work;}
    else{S.timeLeft=ex.rest;S.totalTime=ex.rest;}
  } else {
    const ex=w.cooldown[S.phaseExIdx];
    S.mode='work';S.timeLeft=ex.dur;S.totalTime=ex.dur;
  }
  S.midpointAlerted=false;
}

/* =============================================
   TIMER TICK
   ============================================= */
function startTicker(){
  clearInterval(ticker);
  ticker=setInterval(tick,1000);
}

function tick(){
  if(S.paused)return;
  // 3-beep countdown
  if(S.timeLeft<=3&&S.timeLeft>0)countdownBeep();
  // Midpoint alert for bilateral exercises
  if(!S.midpointAlerted&&S.totalTime>=60&&S.timeLeft===Math.floor(S.totalTime/2)){
    const ex=currentEx();
    if(ex&&ex.bilateral)midBeep();
    S.midpointAlerted=true;
  }
  S.timeLeft--;
  if(S.timeLeft<=0){
    advanceStep();
  } else {
    renderWorkoutUI();
  }
}

function currentEx(){
  const w=WORKOUTS[S.workoutDayKey];
  if(S.phase==='warmup')return w.warmup[S.phaseExIdx];
  if(S.phase==='circuit')return w.circuit[S.phaseExIdx];
  if(S.phase==='cooldown')return w.cooldown[S.phaseExIdx];
}

function nextExInfo(){
  const w=WORKOUTS[S.workoutDayKey];
  if(S.phase==='warmup'){
    if(S.phaseExIdx+1<w.warmup.length)return{name:w.warmup[S.phaseExIdx+1].name,phase:'Warm-Up'};
    return{name:w.circuit[0].name,phase:'Circuit Rd 1'};
  }
  if(S.phase==='circuit'){
    if(S.mode==='work')return{name:w.circuit[S.phaseExIdx].name,phase:'Rest'};
    const ni=S.phaseExIdx+1;
    if(ni<w.circuit.length)return{name:w.circuit[ni].name,phase:'Round '+S.circuitRound};
    if(S.circuitRound<3)return{name:w.circuit[0].name,phase:'Round '+(S.circuitRound+1)};
    return w.cooldown.length?{name:w.cooldown[0].name,phase:'Cool-Down'}:{name:'Complete!',phase:'Done'};
  }
  if(S.phase==='cooldown'){
    if(S.phaseExIdx+1<w.cooldown.length)return{name:w.cooldown[S.phaseExIdx+1].name,phase:'Cool-Down'};
    return{name:'All done!',phase:'Complete'};
  }
  return null;
}

function advanceStep(){
  const w=WORKOUTS[S.workoutDayKey];
  if(S.phase==='warmup'){
    S.phaseExIdx++;
    if(S.phaseExIdx>=w.warmup.length){
      showTransition('Circuit Round 1','3 rounds × 40s work / 20s rest','circuit_start');
      return;
    }
  } else if(S.phase==='circuit'){
    if(S.mode==='work'){
      if(w.circuit[S.phaseExIdx].rest>0){S.mode='rest';workBeep();}
      else{advanceCircuit(w);}
    } else {
      advanceCircuit(w);
    }
  } else if(S.phase==='cooldown'){
    S.phaseExIdx++;
    if(S.phaseExIdx>=w.cooldown.length){clearInterval(ticker);showComplete();return;}
  }
  if(S.phase!=='circuit'||S.mode!=='rest'){restBeep();}
  setupCurrentStep();
  renderWorkoutUI();
}

function advanceCircuit(w){
  S.phaseExIdx++;
  if(S.phaseExIdx>=w.circuit.length){
    if(S.circuitRound<3){
      S.circuitRound++;S.phaseExIdx=0;S.mode='work';
      showTransition('Round '+S.circuitRound,'Keep it up — '+S.circuitRound+' of 3 rounds','round');
      return;
    } else {
      if(w.cooldown.length){showTransition('Cool-Down','Well done! Time to recover','cooldown_start');return;}
      else{clearInterval(ticker);showComplete();return;}
    }
  }
  S.mode='work';
  restBeep();
}

function showTransition(title,sub,type){
  const overlay=document.getElementById('transition');
  document.getElementById('tr-title').textContent=title;
  document.getElementById('tr-sub').textContent=sub;
  overlay.classList.add('on');
  let c=3;
  document.getElementById('tr-count').textContent=c;
  const t=setInterval(()=>{
    c--;
    if(c>0){document.getElementById('tr-count').textContent=c;countdownBeep();}
    else{
      clearInterval(t);
      overlay.classList.remove('on');
      if(type==='circuit_start'||type==='round'){S.phase='circuit';}
      if(type==='cooldown_start'){S.phase='cooldown';S.phaseExIdx=0;}
      S.mode='work';S.phaseExIdx=(type==='round')?S.phaseExIdx:0;
      setupCurrentStep();
      renderWorkoutUI();
      phaseBeep();
    }
  },1000);
}

/* Local media contract: assets/manifest.js. No library, fetch, or build step needed. */
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let visualKey = null;
let visualCleanup = () => {};

function localAssetPath(path, folder, extension){
  // Limit media to simple repository-relative paths, including on GitHub Pages.
  return typeof path==='string' &&
    new RegExp('^assets/'+folder+'/[a-z0-9-]+\\.'+extension+'$').test(path);
}

function renderExerciseVisual(ex, color){
  const host=document.getElementById('anim-svg');
  host.style.color=color;
  const key=ex.svg+'|'+ex.name+'|'+reducedMotion.matches;
  if(key===visualKey)return; // Timer updates must not recreate/restart media.
  visualCleanup();
  visualKey=key;
  let active=true;
  let loadTimer=null;
  let video=null;
  const asset=(window.EXERCISE_ASSETS||{})[ex.svg]||{};
  host.setAttribute('role','img');
  host.setAttribute('aria-label',ex.name+'. '+(asset.label||'Movement illustration.'));
  host.setAttribute('aria-describedby','cue-txt');
  host.classList.toggle('visual-static',reducedMotion.matches);

  function showInline(){
    if(!active)return;
    const svg=SVG[asset.inlineSvg||ex.svg];
    host.replaceChildren();
    if(svg){
      // Only the existing, trusted inline SVG library is inserted as markup.
      host.innerHTML=svg;
      host.firstElementChild.setAttribute('aria-hidden','true');
    } else {
      const message=document.createElement('span');
      message.className='visual-message';
      message.textContent='Illustration unavailable. Follow the form cue below.';
      host.appendChild(message);
    }
    host.dataset.visual='inline';
    syncVisualPlayback();
  }
  function showImage(){
    if(!active)return;
    if(!asset.imageReady||!localAssetPath(asset.image,'images','png'))return;
    const img=new Image();
    img.alt='';
    img.setAttribute('aria-hidden','true');
    img.onload=()=>{
      if(!active)return;
      host.replaceChildren(img);
      host.dataset.visual='image';
    };
    // The inline fallback stays visible while loading or if the PNG fails.
    img.src=asset.image;
  }
  function fallback(){
    if(!active)return;
    clearTimeout(loadTimer);
    if(video){video.pause();video.removeAttribute('src');video.load();video=null;}
    showInline();
    showImage();
  }
  visualCleanup=()=>{
    active=false;
    clearTimeout(loadTimer);
    if(video){video.pause();video.removeAttribute('src');video.load();}
  };
  showInline();
  if(reducedMotion.matches||!asset.animationReady||
      !localAssetPath(asset.animation,'animations','mp4')){
    showImage();
    return;
  }
  video=document.createElement('video');
  video.muted=true;
  video.loop=true;
  video.playsInline=true;
  video.preload='auto';
  video.setAttribute('aria-hidden','true');
  video.addEventListener('loadeddata',()=>{
    if(!active||!video)return;
    clearTimeout(loadTimer);
    host.replaceChildren(video);
    host.dataset.visual='video';
    syncVisualPlayback();
  },{once:true});
  video.addEventListener('error',()=>{if(video)fallback();},{once:true});
  // A stalled request should never leave an empty tile or hold up the workout.
  loadTimer=setTimeout(fallback,8000);
  video.src=asset.animation;
  video.load();
  video.visualFallback=fallback;
}

function syncVisualPlayback(){
  const host=document.getElementById('anim-svg');
  const stopped=S.paused||S.screen!=='workout'||
    (S.phase==='circuit'&&S.mode==='rest')||reducedMotion.matches;
  host.classList.toggle('visual-paused',stopped);
  const video=host.querySelector('video');
  if(!video)return;
  if(stopped){video.pause();return;}
  if(video.paused&&!video.visualPlayPending){
    video.visualPlayPending=true;
    const attempt=video.play();
    if(attempt)attempt.then(()=>{
      video.visualPlayPending=false;
      // A pause or screen change may have happened while play() was pending.
      if(S.paused||S.screen!=='workout'||(S.phase==='circuit'&&S.mode==='rest'))video.pause();
    }).catch(()=>{
      video.visualPlayPending=false;
      if(host.contains(video))video.visualFallback();
    });
    else video.visualPlayPending=false;
  }
}

reducedMotion.addEventListener('change',()=>{
  if(S.workoutDayKey&&currentEx())renderExerciseVisual(currentEx(),document.getElementById('anim-svg').style.color);
  syncVisualPlayback();
});

/* =============================================
   WORKOUT UI RENDER
   ============================================= */
function renderWorkoutUI(){
  const w=WORKOUTS[S.workoutDayKey];
  const ex=currentEx();
  const isRest=S.phase==='circuit'&&S.mode==='rest';
  const phaseColor=S.phase==='warmup'?'var(--warmup)':S.phase==='cooldown'?'var(--cooldown)':isRest?'var(--rest)':'var(--work)';
  const phaseName=S.phase==='warmup'?'WARM-UP':S.phase==='cooldown'?'COOL-DOWN':isRest?'REST':'CIRCUIT';

  document.getElementById('w-phase-lbl').textContent=phaseName;
  document.getElementById('w-phase-lbl').style.color=phaseColor;
  document.getElementById('w-round').textContent=S.phase==='circuit'?'Round '+S.circuitRound+' / 3':'';

  // Progress bar (total session)
  const totalSec=900;
  let elapsed=0;
  if(S.phase==='warmup')elapsed=w.warmup.slice(0,S.phaseExIdx).reduce((a,b)=>a+b.dur,0)+(S.totalTime-S.timeLeft);
  else if(S.phase==='circuit'){
    elapsed=w.warmup.reduce((a,b)=>a+b.dur,0);
    const exTime=(w.circuit[0].work+w.circuit[0].rest);
    elapsed+=(S.circuitRound-1)*w.circuit.length*exTime+S.phaseExIdx*exTime+(S.mode==='rest'?w.circuit[S.phaseExIdx].work:0)+(S.totalTime-S.timeLeft);
  } else {
    elapsed=w.warmup.reduce((a,b)=>a+b.dur,0)+540+w.cooldown.slice(0,S.phaseExIdx).reduce((a,b)=>a+b.dur,0)+(S.totalTime-S.timeLeft);
  }
  document.getElementById('prog-fill').style.width=Math.min(100,(elapsed/totalSec)*100)+'%';
  document.getElementById('prog-fill').style.background=phaseColor;

  // Phase pill
  const pill=document.getElementById('phase-pill');
  pill.textContent=S.phase==='warmup'?'⚡ Warm-Up':S.phase==='cooldown'?'🌊 Cool-Down':isRest?'💤 Rest & Recover':'💪 Circuit — Round '+S.circuitRound;
  pill.style.background=phaseColor+'18';
  pill.style.borderColor=phaseColor+'55';
  pill.style.color=phaseColor;

  if(isRest){
    document.getElementById('ex-area').style.display='none';
    const rs=document.getElementById('rest-screen');
    rs.classList.add('active');
    document.getElementById('rest-timer').textContent=S.timeLeft;
    document.getElementById('rest-timer').style.color=S.timeLeft<=5?'var(--rest)':'var(--text)';
    const nextCirc=w.circuit[(S.phaseExIdx+1)%w.circuit.length];
    const isNextRound=(S.phaseExIdx+1)>=w.circuit.length;
    document.getElementById('rest-up-name').textContent=isNextRound?w.circuit[0].name+' (Round '+(S.circuitRound+1)+')':nextCirc.name;
    document.getElementById('rest-bar-fill').style.width=(S.timeLeft/S.totalTime)*100+'%';
    document.getElementById('rest-bar-fill').style.background='var(--rest)';
  } else {
    document.getElementById('rest-screen').classList.remove('active');
    document.getElementById('ex-area').style.display='block';
    document.getElementById('ex-name').textContent=ex.name;
    document.getElementById('ex-focus').textContent=ex.focus||'';
    renderExerciseVisual(ex,phaseColor);
    const chip=document.getElementById('mode-chip');
    if(S.phase==='circuit'&&S.mode==='work'){chip.style.display='block';chip.textContent='WORK';chip.style.background=phaseColor+'30';chip.style.color=phaseColor;}
    else chip.style.display='none';
    const t=document.getElementById('timer-num');
    t.textContent=S.timeLeft<10?'0'+S.timeLeft:S.timeLeft;
    t.style.color=S.timeLeft<=5?'var(--rest)':phaseColor;
    document.getElementById('timer-bar-fill').style.width=(S.timeLeft/S.totalTime)*100+'%';
    document.getElementById('timer-bar-fill').style.background=phaseColor;
    const cue=ex.cue||'';
    document.getElementById('cue-txt').textContent=cue;
    // Bilateral midpoint hint
    if(ex.bilateral&&S.totalTime>=60){
      const mid=Math.floor(S.totalTime/2);
      if(S.timeLeft>mid)document.getElementById('timer-sub').textContent='first side';
      else document.getElementById('timer-sub').textContent='switch sides at '+mid+'s ↔';
    } else {
      document.getElementById('timer-sub').textContent='seconds';
    }
    const nxt=nextExInfo();
    document.getElementById('next-hint').innerHTML=nxt&&nxt.name!=='All done!'&&nxt.name!=='Complete!'?`Next → <strong>${nxt.name}</strong> <span style="color:var(--muted)">(${nxt.phase})</span>`:'Almost there! 🏁';
  }

  syncVisualPlayback();

  // Play/pause button
  const playBtn=document.getElementById('w-play');
  const playIcon=document.getElementById('play-icon');
  const playLbl=document.getElementById('play-lbl');
  if(S.paused){playBtn.style.background='var(--warmup)';playBtn.style.color='#0c1a33';playIcon.textContent='▶';playLbl.textContent='Resume';}
  else{playBtn.style.background='var(--work)';playBtn.style.color='#052e16';playIcon.textContent='⏸';playLbl.textContent='Pause';}
}

function togglePause(){
  S.paused=!S.paused;
  if(!S.paused&&ticker===null)startTicker();
  renderWorkoutUI();
}

function skipStep(){
  if(confirm('Skip this step?')){S.timeLeft=1;tick();}
}

/* =============================================
   COMPLETE SCREEN
   ============================================= */
function showComplete(){
  const w=WORKOUTS[S.workoutDayKey];
  recordComplete(S.workoutDayKey);
  phaseBeep();setTimeout(phaseBeep,300);
  document.getElementById('comp-sub').textContent=`${w.icon} ${w.name} — ${new Date().toLocaleDateString('en-US',{weekday:'long'})}`;
  document.getElementById('comp-ex-count').textContent=(w.warmup.length+w.circuit.length+w.cooldown.length);
  document.getElementById('comp-rounds').textContent=w.circuit.length?'3':'—';
  document.getElementById('rule2-txt').innerHTML='<strong>Rule of 2:</strong> When you can complete all 40 seconds of any circuit exercise with perfect form for <strong>two consecutive workouts without joint discomfort</strong>, progress it slightly — lower the push-up incline, pause 2 seconds at the bottom of the squat, or add 1–2 reps.';
  showScreen('complete');
}

function finishWorkout(){markDone(S.workoutDayKey);goHome();}
function goHome(){showScreen('home');S.workoutDayKey=null;renderHome();}
function confirmBack(){if(confirm('End workout and return to home?')){clearInterval(ticker);ticker=null;goHome();}}
function showScreen(s){
  ['home','workout','complete'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.display=(id===s)?'flex':'none';
  });
  S.screen=s;
  syncVisualPlayback();
}

/* =============================================
   INIT
   ============================================= */
function init(){
  const today=new Date().getDay();
  S.selectedDay=today;
  showScreen('home');
  renderHome();
  // Resume audio context on first tap
  document.addEventListener('touchstart',()=>{try{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}},{once:true});
  document.addEventListener('click',()=>{try{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}},{once:true});
}

init();
</script>
